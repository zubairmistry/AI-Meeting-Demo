services:
  - type: web
    name: ai-meeting-demo
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 180 --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECRET_KEY

        generateValue: true
      - key: ENCRYPTION_KEY

        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-meeting-db
          property: connectionString

databases:
  - name: ai-meeting-db
    databaseName: ai_meeting
    user: ai_user
    plan: free
